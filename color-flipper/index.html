<!doctype html>
<html lang="en">
  <head>
    <title>Color Flipper</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      h1 {
        margin-bottom: 30px;
      }
      .container {
        text-align: center;
        padding: 40px;
        background-color: rgb(76, 184, 184);
        border: 2px solid black;
        border-radius: 5px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      #green {
        background-color: green;
      }
      #red {
        background-color: red;
      }
      #blue {
        background-color: blue;
      }

      button {
        margin: 10px;
        height: 50px;
        width: 100px;
        border-radius: 5px;
        font-weight: bold;
        border-color: black;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Color Flipper</h1>
      <div class="buttons">
        <button id="green" onclick="setColor('green')">Green</button>
        <button id="red" onclick="setColor('red')">Red</button>
        <button id="blue" onclick="setColor('blue')">Blue</button>
        <button onclick="randomColor('colors')">Random</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
